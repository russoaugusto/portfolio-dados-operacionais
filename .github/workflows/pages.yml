name: Atualizar painel do portfólio

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 1 * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:

permissions: {}

env:
  TZ: America/Sao_Paulo

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Obter o código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validar testes, dependências e segurança do código
        run: |
          python3 -m unittest discover -v
          python3 scripts/security_checks.py
          python3 -m compileall -q build_data.py novos_cases.py test_portfolio.py scripts
      - name: Validar a série e gerar os cases disponíveis
        run: |
          python3 novos_cases.py
          python3 build_data.py
      - name: Validar o painel
        run: |
          node --check site/app.js
          node --check site/fila/app.mjs
          node --test tests/fila*.test.mjs
          python3 -m json.tool site/data.json > /dev/null
          test -s site/index.html
          test -s site/styles.css
      - name: Empacotar o painel
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
